<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play view keyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050608}
.tab{height:30px;padding:0 12px;border-radius:7px;border:0;font:600 12.5px Inter,sans-serif;display:inline-flex;align-items:center;text-decoration:none}
.tab:focus-visible,.ptg:focus-visible,.mr:focus-visible{outline:2px solid #EDF0F4;outline-offset:2px}
.ptg{height:30px;padding:0 10px;border-radius:7px;display:inline-flex;align-items:center;gap:7px;font:600 12.5px Inter,sans-serif;cursor:pointer}
.mr{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:7px;font:600 13px Inter,sans-serif;cursor:pointer;text-align:left}
.mc{font:500 11.5px 'JetBrains Mono',monospace;width:58px;flex:none}
.md{width:6px;height:6px;border-radius:3px;flex:none}
</style>
</helmet>
<div style="width:1344px;height:660px;box-sizing:border-box;background:#0A0C0F;border:1px solid #262C36;border-radius:14px;overflow:hidden;color:#EDF0F4;font-family:Inter,sans-serif;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)">
<div style="height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #1A1F27;background:#0D0F13">
<span style="font:700 15px 'Space Grotesk',sans-serif">Helldivers 2</span>
<span style="font-size:12.5px;color:#8E98A8">Game defaults</span>
<div style="flex:1"></div>
<button type="button" class="ptg" aria-pressed="{{pedalsPressed}}" onClick="{{togglePedals}}" style="{{pedalsBtn}}"><span style="{{pedalsDot}}"></span>Pedals</button>
<div style="display:flex;gap:2px;padding:3px;background:#111419;border:1px solid #20252E;border-radius:9px">
<a class="tab" href="Play.dc.html" style="color:#8E98A8">Azerons</a>
<a class="tab" href="PlayKeys.dc.html" aria-current="page" style="background:#262C36;color:#EDF0F4;box-shadow:inset 0 -2px 0 #FFB224">Keyboard</a>
<a class="tab" href="PlayPad.dc.html" style="color:#8E98A8">Controller</a>
</div>
</div>

<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 20px;min-height:0">
<div style="display:flex;align-items:center;gap:24px">
<dc-import name="Keyboard" lit="{{litK}}" selected="" on-pick="{{pressK}}" hint-size="956px,392px"></dc-import>
<div style="width:220px;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:12px">
<svg viewBox="0 0 120 190" width="120" height="190" style="align-self:center" role="img" aria-label="{{mouseAria}}">
<path d="M60 6C92 6 112 28 112 64V130C112 166 90 186 60 186C30 186 8 166 8 130V64C8 28 28 6 60 6Z" fill="#111419" stroke="#6B7687" stroke-width="1.5"></path>
<path d="M60 6C28 6 8 28 8 64V78H60Z" fill="{{m.left.fill}}" stroke="{{m.left.stroke}}" stroke-width="{{m.left.sw}}" stroke-linejoin="round"></path>
<path d="M60 6C92 6 112 28 112 64V78H60Z" fill="{{m.right.fill}}" stroke="{{m.right.stroke}}" stroke-width="{{m.right.sw}}" stroke-linejoin="round"></path>
<rect x="51" y="28" width="18" height="32" rx="9" fill="{{m.wheel.fill}}" stroke="{{m.wheel.stroke}}" stroke-width="{{m.wheel.sw}}"></rect>
<rect x="3" y="92" width="11" height="26" rx="4" fill="{{m.side1.fill}}" stroke="{{m.side1.stroke}}" stroke-width="{{m.side1.sw}}"></rect>
<rect x="3" y="122" width="11" height="24" rx="4" fill="{{m.side2.fill}}" stroke="{{m.side2.stroke}}" stroke-width="{{m.side2.sw}}"></rect>
</svg>
<div style="display:flex;flex-direction:column;gap:3px">
<sc-for list="{{mouseRows}}" as="r" hint-placeholder-count="5">
<button type="button" class="mr" style="{{r.style}}" onClick="{{r.pick}}" aria-label="{{r.aria}}"><span class="mc" style="{{r.codeStyle}}">{{r.code}}</span><span class="md" style="{{r.dot}}"></span>{{r.action}}</button>
</sc-for>
</div>
</div>
</div>
<sc-if value="{{showPedals}}" hint-placeholder-val="{{true}}">
<dc-import name="Pedals" axes="{{axes}}" lit="{{litP}}" selected="" on-pick="{{pressP}}" hint-size="600px,112px"></dc-import>
</sc-if>
</div>

<div style="height:40px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-top:1px solid #1A1F27;font-size:12px;color:#8E98A8"><span style="flex:1">The game's own keyboard layout, harvested from its files. Plain keys are not used. Change it in a scheme; Apply writes the game's file.</span><span>Presses light up here. Click a key to try it.</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1344,"height":660}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { lit: 'M:left', pedals: true, pv: { ltoe: 0, rudder: 50, rtoe: 0 } }; }
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
const s = this.state;
const ROLE = { combat: '#FF7A90', move: '#3BD6B0', ability: '#6EA8FF', travel: '#B5E361', menu: '#B99BFF' };
const MOUSE = [['left', 'Left', 'Fire', 'combat'], ['right', 'Right', 'Aim', 'combat'], ['wheel', 'Wheel', 'Ping', 'ability'], ['side1', 'Side 1', 'Melee', 'combat'], ['side2', 'Side 2', 'Weapon menu', 'menu']];
const AX = [
{ id: 'ltoe', name: 'Left toe', drives: 'Sprint', rest: 'end' },
{ id: 'rudder', name: 'Rudder', drives: '', rest: 'centre' },
{ id: 'rtoe', name: 'Right toe', drives: 'Use stim', rest: 'end' }
];
const [h, p] = (s.lit || ':').split(':');
const part = (id) => h === 'M' && p === id
? { fill: '#3A2E14', stroke: '#FFB224', sw: '2' }
: { fill: id === 'left' || id === 'right' ? '#111419' : '#1A1F27', stroke: '#6B7687', sw: '1.5' };
const m = {}; MOUSE.forEach(([id]) => { m[id] = part(id); });
const mouseRows = MOUSE.map(([id, code, action, role]) => {
const on = h === 'M' && p === id;
return {
code, action, aria: code + ' button, ' + action + (on ? ', pressed' : ''),
pick: () => this.setState({ lit: 'M:' + id }),
style: on ? 'background:#3A2E14;border:1px solid #5A4316;color:#FFB224' : 'background:transparent;border:1px solid transparent;color:#EDF0F4',
codeStyle: 'color:' + (on ? '#FFB224' : '#8E98A8'),
dot: 'background:' + (on ? '#FFB224' : ROLE[role])
};
});
const pressP = (id) => {
const a = AX.find((x) => x.id === id);
if (!a || !a.drives) return;
clearTimeout(this.t);
const pv = { ltoe: 0, rudder: 50, rtoe: 0 }; pv[id] = id === 'rudder' ? 20 : 72;
this.setState({ lit: 'P:' + id, pv });
this.t = setTimeout(() => this.setState({ pv: { ltoe: 0, rudder: 50, rtoe: 0 } }), 900);
};
const litName = h === 'M' ? (MOUSE.find((x) => x[0] === p) || [])[1] : '';
return {
m, mouseRows,
mouseAria: 'Mouse' + (litName ? ', ' + litName.toLowerCase() + ' button pressed' : ''),
litK: h === 'K' ? p : '', litP: h === 'P' ? p : '',
pressK: (id) => this.setState({ lit: 'K:' + id }),
pressP,
axes: AX.map((a) => Object.assign({}, a, { value: s.pv[a.id] })),
showPedals: s.pedals,
pedalsPressed: s.pedals ? 'true' : 'false',
togglePedals: () => this.setState({ pedals: !s.pedals }),
pedalsBtn: s.pedals ? 'background:#1A1F27;color:#EDF0F4;border:1px solid #2A313C' : 'background:transparent;color:#8E98A8;border:1px dashed #6B7687',
pedalsDot: 'width:7px;height:7px;border-radius:4px;background:' + (s.pedals ? '#4ADE80' : 'transparent') + ';border:1.5px solid ' + (s.pedals ? '#4ADE80' : '#8E98A8') + ';box-sizing:border-box'
};
}
}
</script>
</body>
</html>
