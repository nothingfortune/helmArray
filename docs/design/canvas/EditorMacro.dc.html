<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scheme editor, macro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#0A0C0F}</style>
</helmet>
<div style="background:#0A0C0F;min-height:900px">
<dc-import name="Editor" start="macro" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
