class Component extends DCLogic {
constructor(p) { super(p); this.state = { lit: 'rt', pedals: true, pv: { ltoe: 0, rudder: 50, rtoe: 0 } }; }
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
const s = this.state;
const ROLE = { combat: '#FF7A90', move: '#3BD6B0', ability: '#6EA8FF', travel: '#B5E361', menu: '#B99BFF' };
// row id, label on the pad, game word, role, which drawn control lights up
const LEFT = [['lt', 'LT', 'Aim', 'combat', 'lt'], ['lb', 'LB', 'Stratagems', 'ability', 'lb'], ['ls', 'L stick', 'Move', 'move', 'ls'], ['lclick', 'L click', 'Sprint', 'move', 'ls'],
['dup', 'D-pad ↑', 'Flashlight', 'ability', 'dpad'], ['ddown', 'D-pad ↓', 'Ping', 'ability', 'dpad'], ['dleft', 'D-pad ←', 'Weapon menu', 'menu', 'dpad'], ['dright', 'D-pad →', 'Fire mode', 'combat', 'dpad'], ['view', 'View', 'Map', 'menu', 'view']];
const RIGHT = [['rt', 'RT', 'Fire', 'combat', 'rt'], ['rb', 'RB', 'Throw grenade', 'combat', 'rb'], ['y', 'Y', 'Swap weapon', 'combat', 'y'], ['b', 'B', 'Crouch / prone', 'move', 'b'],
['a', 'A', 'Jump / dive', 'move', 'a'], ['x', 'X', 'Reload / interact', 'combat', 'x'], ['rs', 'R stick', 'Look', 'move', 'rs'], ['rclick', 'R click', 'Melee', 'combat', 'rs'], ['menu', 'Menu', 'Menu', 'menu', 'menu']];
const ALL = LEFT.concat(RIGHT);
const AX = [
{ id: 'ltoe', name: 'Left toe', drives: 'Sprint', rest: 'end' },
{ id: 'rudder', name: 'Rudder', drives: '', rest: 'centre' },
{ id: 'rtoe', name: 'Right toe', drives: 'Use stim', rest: 'end' }
];
const litRow = ALL.find((r) => r[0] === s.lit);
const litPart = litRow ? litRow[4] : '';
const row = ([id, code, action, role]) => {
const on = s.lit === id;
return {
code, action, aria: code + ', ' + action + (on ? ', pressed' : ''),
pick: () => this.setState({ lit: id }),
style: on ? 'background:#3A2E14;border:1px solid #5A4316;color:#FFB224' : 'background:transparent;border:1px solid transparent;color:#EDF0F4',
codeStyle: 'color:' + (on ? '#FFB224' : '#8E98A8'),
dot: 'background:' + (on ? '#FFB224' : ROLE[role])
};
};
const o = {}, hit = {};
['lt', 'rt', 'lb', 'rb', 'ls', 'rs', 'dpad', 'y', 'x', 'b', 'a', 'view', 'menu'].forEach((k) => {
const on = litPart === k;
const trig = k === 'lt' || k === 'rt';
o[k] = trig
? { fill: on ? '#3A2E14' : '#1A1F27', stroke: on ? '#FFB224' : '#8E98A8', sw: on ? '2' : '1.5', text: on ? '#FFB224' : '#8E98A8' }
: { fill: on ? 'rgba(255,178,36,.22)' : 'transparent', stroke: on ? '#FFB224' : 'none', text: on ? '#FFB224' : '#8E98A8' };
const first = ALL.find((r) => r[4] === k);
hit[k] = () => this.setState({ lit: first[0] });
});
const pressP = (id) => {
const a = AX.find((x) => x.id === id);
if (!a || !a.drives) return;
clearTimeout(this.t);
const pv = { ltoe: 0, rudder: 50, rtoe: 0 }; pv[id] = id === 'rudder' ? 20 : 72;
this.setState({ lit: 'P:' + id, pv });
this.t = setTimeout(() => this.setState({ pv: { ltoe: 0, rudder: 50, rtoe: 0 } }), 900);
};
return {
leftRows: LEFT.map(row), rightRows: RIGHT.map(row), o, hit,
padAria: 'Xbox One style controller' + (litRow ? ', ' + litRow[1] + ' pressed' : ''),
litP: s.lit.indexOf('P:') === 0 ? s.lit.slice(2) : '', pressP,
axes: AX.map((a) => Object.assign({}, a, { value: s.pv[a.id] })),
showPedals: s.pedals,
pedalsPressed: s.pedals ? 'true' : 'false',
togglePedals: () => this.setState({ pedals: !s.pedals }),
pedalsBtn: s.pedals ? 'background:#1A1F27;color:#EDF0F4;border:1px solid #2A313C' : 'background:transparent;color:#8E98A8;border:1px dashed #6B7687',
pedalsDot: 'width:7px;height:7px;border-radius:4px;background:' + (s.pedals ? '#4ADE80' : 'transparent') + ';border:1.5px solid ' + (s.pedals ? '#4ADE80' : '#8E98A8') + ';box-sizing:border-box'
};
}
